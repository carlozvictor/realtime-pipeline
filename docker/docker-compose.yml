services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9004:9004"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config/enable-mysql.xml:/etc/clickhouse-server/config.d/enable-mysql.xml
      - ./clickhouse/config/flink-user.xml:/etc/clickhouse-server/users.d/flink-user.xml
      - ./clickhouse/config/grafana-user.xml:/etc/clickhouse-server/users.d/grafana-user.xml
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  flink-jobmanager:
    build:
      context: ..
      dockerfile: docker/flink/Dockerfile
    ports:
      - "8082:8081"
    depends_on:
      - kafka
      - clickhouse
    command: standalone-job --job-classname com.realtimepipeline.PipelineJob
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\nrestart-strategy.type: fixed-delay\nrestart-strategy.fixed-delay.attempts: 2147483647\nrestart-strategy.fixed-delay.delay: 10 s\nexecution.checkpointing.interval: 30 s\nexecution.checkpointing.mode: EXACTLY_ONCE\nstate.checkpoints.dir: file:///opt/flink/checkpoints\nmetrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249"
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  flink-taskmanager:
    build:
      context: ..
      dockerfile: docker/flink/Dockerfile
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 4\nstate.checkpoints.dir: file:///opt/flink/checkpoints\nmetrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nmetrics.reporter.prom.port: 9249"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - flink-jobmanager
      - kafka-exporter

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      - prometheus

  ingest:
    build: ../ingest
    depends_on:
      - kafka
    environment:
      JETSTREAM_URL: ${JETSTREAM_URL}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}

volumes:
  ch-data:
  flink-checkpoints:
