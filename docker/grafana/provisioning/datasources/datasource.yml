apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: default
      username: grafana
    secureJsonData:
      password: ""
    editable: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    isDefault: false
    jsonData:
      httpMethod: POST
    url: http://prometheus:9090
    editable: true
