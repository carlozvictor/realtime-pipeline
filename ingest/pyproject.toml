[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
